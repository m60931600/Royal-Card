<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الأسطوري 👑</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', 'Segoe UI', sans-serif; }
        
        :root {
            --primary: #f7e05e;
            --primary-dark: #f5b342;
            --bg: #0b0e1a;
            --card-bg: #1a1f2f;
            --text: #ffffff;
            --text-dark: #1a1a2e;
            --shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: 0.3s;
        }
        
        /* ===== القائمة الجانبية ===== */
        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100%;
            background: var(--card-bg);
            transition: 0.3s;
            padding: 30px 20px;
            z-index: 1000;
            overflow-y: auto;
            border-right: 3px solid var(--primary);
        }
        
        .sidebar.active {
            right: 0;
        }
        
        .sidebar .close-btn {
            background: var(--primary);
            border: none;
            font-size: 30px;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 10px;
            color: var(--text-dark);
            margin-bottom: 20px;
        }
        
        .sidebar h2 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .sidebar .menu-item {
            color: var(--text);
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 5px;
            border: 1px solid transparent;
        }
        
        .sidebar .menu-item:hover {
            background: var(--primary);
            color: var(--text-dark);
        }
        
        .sidebar .menu-item.active {
            background: var(--primary);
            color: var(--text-dark);
        }
        
        /* ===== زر القائمة (هامبرغر) ===== */
        .hamburger {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            cursor: pointer;
            background: var(--primary);
            padding: 10px 12px;
            border-radius: 10px;
            border: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .hamburger span {
            display: block;
            width: 30px;
            height: 4px;
            background: var(--text-dark);
            border-radius: 5px;
            transition: 0.3s;
        }
        
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }
        
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }
        
        /* ===== البطاقة ===== */
        .card {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            max-width: 450px;
            width: 100%;
            padding: 30px 25px;
            border-radius: 60px 20px 60px 20px;
            box-shadow: var(--shadow), 0 0 0 3px #ffd966, 0 0 0 8px var(--card-bg);
            text-align: center;
            color: var(--text-dark);
            transition: 0.3s;
            margin: 60px 0;
        }
        
        .card:hover {
            transform: scale(1.02);
        }
        
        .card .store-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }
        
        .card h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0 #fff3b0;
            margin-bottom: 5px;
        }
        
        .card .sub {
            font-size: 1.2rem;
            background: var(--card-bg);
            color: var(--primary);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        
        .card .price {
            font-size: 3.8rem;
            font-weight: 900;
            background: var(--card-bg);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 80px;
            display: inline-block;
            margin: 10px 0 20px;
            box-shadow: inset 0 -4px 0 #b37b2e;
        }
        
        .card .features {
            text-align: right;
            background: rgba(26, 31, 47, 0.2);
            padding: 15px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            margin: 15px 0;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .card .features li {
            list-style: none;
            padding: 6px 0;
            border-bottom: 1px dashed #ffffff70;
        }
        
        .card .features li:last-child {
            border: none;
        }
        
        .card .btn {
            background: var(--card-bg);
            color: var(--primary);
            border: none;
            padding: 16px 30px;
            font-size: 1.4rem;
            font-weight: 800;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #0b0e1a;
            margin-top: 10px;
        }
        
        .card .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 0 #0b0e1a;
            background: #2a2f4a;
        }
        
        .card .btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #0b0e1a;
        }
        
        .card .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .card .login-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .card .login-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .card .login-buttons .google {
            background: #db4437;
            color: white;
        }
        
        .card .login-buttons .facebook {
            background: #4267B2;
            color: white;
        }
        
        .card .login-buttons button:hover {
            transform: scale(1.05);
        }
        
        .card .user-info {
            color: var(--text-dark);
            margin-top: 10px;
            font-weight: 600;
        }
        
        .footer {
            margin-top: 18px;
            font-size: 0.8rem;
            opacity: 0.7;
            font-weight: 500;
        }
        
        /* ===== لوحة التحكم ===== */
        .admin-panel {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-top: 20px;
            color: var(--text);
        }
        
        .admin-panel.show {
            display: block;
        }
        
        .admin-panel h3 {
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .admin-panel label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }
        
        .admin-panel input, .admin-panel select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0b0e1a;
            color: white;
            margin-bottom: 10px;
        }
        
        .admin-panel .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .admin-panel .color-picker input {
            width: 60px;
            height: 60px;
            padding: 0;
            border: 2px solid var(--primary);
            cursor: pointer;
        }
        
        /* ===== قسم إضافة أقسام ===== */
        .add-section {
            margin-top: 15px;
            padding: 15px;
            background: #0b0e1a;
            border-radius: 15px;
        }
        
        .add-section input {
            width: 70%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: transparent;
            color: white;
        }
        
        .add-section button {
            padding: 10px 20px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        
        /* ===== التجاوب ===== */
        @media (max-width: 500px) {
            .card { padding: 20px; }
            .card h1 { font-size: 2rem; }
            .card .price { font-size: 2.5rem; }
            .login-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- ===== زر القائمة (هامبرغر) ===== -->
<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
</button>

<!-- ===== القائمة الجانبية ===== -->
<div class="sidebar" id="sidebar">
    <button class="close-btn" onclick="toggleSidebar()">✕</button>
    <h2>🏠 القائمة</h2>
    <div id="menuItems">
        <div class="menu-item active" onclick="switchSection('home')">🏠 الرئيسية</div>
        <div class="menu-item" onclick="switchSection('products')">📦 المنتجات</div>
        <div class="menu-item" onclick="switchSection('about')">ℹ️ عن المتجر</div>
        <div class="menu-item" onclick="switchSection('admin')">⚙️ لوحة التحكم</div>
    </div>
    
    <div class="add-section" id="addSection">
        <h4 style="color:var(--primary);margin:10px 0;">➕ أضف قسم جديد</h4>
        <input type="text" id="newSectionName" placeholder="اسم القسم...">
        <button onclick="addSection()">أضف</button>
    </div>
</div>

<!-- ===== البطاقة الرئيسية ===== -->
<div class="card" id="mainCard">
    <div class="store-icon" id="storeIcon">👑</div>
    <h1 id="storeName">Royal Store</h1>
    <span class="sub" id="storeSub">✦ المتجر الأسطوري ✦</span>
    <div class="price" id="storePrice">$49.99</div>
    
    <ul class="features" id="featuresList">
        <li>✅ وصول غير محدود</li>
        <li>✅ دعم فوري 24/7</li>
        <li>✅ منتجات حصرية</li>
        <li>✅ تجربة أسطورية</li>
    </ul>
    
    <!-- زر الشراء -->
    <button class="btn" id="buyBtn" disabled>🔒 سجل لتشتري</button>
    
    <!-- أزرار تسجيل الدخول -->
    <div class="login-buttons" id="loginButtons">
        <button class="google" onclick="loginWithGoogle()">🅶 Google</button>
        <button class="facebook" onclick="loginWithFacebook()">ƒ Facebook</button>
    </div>
    
    <div class="user-info" id="userInfo"></div>
    <div class="footer" id="footerText">© 2026 Royal Store — صنع بالذكاء</div>
</div>

<!-- ===== لوحة التحكم (تظهر في القائمة) ===== -->
<div id="adminPanel" class="admin-panel">
    <h3>⚙️ لوحة التحكم</h3>
    
    <label>🏷️ اسم المتجر:</label>
    <input type="text" id="editStoreName" value="Royal Store" oninput="updateStore()">
    
    <label>💰 السعر:</label>
    <input type="text" id="editPrice" value="$49.99" oninput="updateStore()">
    
    <label>🎨 الألوان:</label>
    <div class="color-picker">
        <input type="color" id="colorPrimary" value="#f7e05e" oninput="updateColors()">
        <input type="color" id="colorBg" value="#0b0e1a" oninput="updateColors()">
        <input type="color" id="colorCard" value="#1a1f2f" oninput="updateColors()">
        <input type="color" id="colorText" value="#ffffff" oninput="updateColors()">
    </div>
    
    <label>📝 الملصقات (كل ملصق في سطر):</label>
    <textarea id="editFeatures" rows="4" oninput="updateFeatures()">✅ وصول غير محدود
✅ دعم فوري 24/7
✅ منتجات حصرية
✅ تجربة أسطورية</textarea>
    
    <label>🖼️ أيقونة المتجر:</label>
    <input type="text" id="editIcon" value="👑" oninput="updateStore()">
    
    <label>📌 النص السفلي:</label>
    <input type="text" id="editFooter" value="© 2026 Royal Store — صنع بالذكاء" oninput="updateStore()">
</div>

<script>
// ===== إدارة القائمة الجانبية =====
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const hamburger = document.getElementById('hamburger');
    sidebar.classList.toggle('active');
    hamburger.classList.toggle('active');
}

function switchSection(section) {
    // تحديث العنصر النشط
    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');
    
    // إظهار/إخفاء لوحة التحكم
    const adminPanel = document.getElementById('adminPanel');
    if (section === 'admin') {
        adminPanel.classList.add('show');
    } else {
        adminPanel.classList.remove('show');
    }
    
    // إغلاق القائمة
    toggleSidebar();
}

// ===== إضافة أقسام جديدة =====
function addSection() {
    const name = document.getElementById('newSectionName').value.trim();
    if (!name) return alert('❌ أدخل اسم القسم!');
    
    const menuItems = document.getElementById('menuItems');
    const newItem = document.createElement('div');
    newItem.className = 'menu-item';
    newItem.textContent = '📌 ' + name;
    newItem.onclick = function() {
        alert('📂 قسم: ' + name + '\n(يمكنك تخصيص هذا القسم لاحقاً)');
        toggleSidebar();
    };
    menuItems.appendChild(newItem);
    document.getElementById('newSectionName').value = '';
}

// ===== تحديث المتجر =====
function updateStore() {
    document.getElementById('storeName').textContent = document.getElementById('editStoreName').value || 'Royal Store';
    document.getElementById('storePrice').textContent = document.getElementById('editPrice').value || '$0';
    document.getElementById('storeIcon').textContent = document.getElementById('editIcon').value || '👑';
    document.getElementById('footerText').textContent = document.getElementById('editFooter').value || '© 2026 Royal Store';
}

function updateColors() {
    const primary = document.getElementById('colorPrimary').value;
    const bg = document.getElementById('colorBg').value;
    const card = document.getElementById('colorCard').value;
    const text = document.getElementById('colorText').value;
    
    document.documentElement.style.setProperty('--primary', primary);
    document.documentElement.style.setProperty('--bg', bg);
    document.documentElement.style.setProperty('--card-bg', card);
    document.documentElement.style.setProperty('--text', text);
}

function updateFeatures() {
    const text = document.getElementById('editFeatures').value;
    const lines = text.split('\n').filter(line => line.trim());
    const list = document.getElementById('featuresList');
    list.innerHTML = lines.map(line => `<li>${line.trim()}</li>`).join('');
}

// ===== تسجيل الدخول =====
let currentUser = null;

function loginWithGoogle() {
    // محاكاة تسجيل الدخول (بدون Firebase حقيقية)
    currentUser = { name: 'مستخدم Google', email: 'user@gmail.com', photo: '🅶' };
    showUser();
}

function loginWithFacebook() {
    currentUser = { name: 'مستخدم Facebook', email: 'user@facebook.com', photo: 'ƒ' };
    showUser();
}

function showUser() {
    const userInfo = document.getElementById('userInfo');
    const buyBtn = document.getElementById('buyBtn');
    const loginBtns = document.getElementById('loginButtons');
    
    userInfo.textContent = `👋 مرحباً ${currentUser.name}`;
    buyBtn.textContent = '🛒 اشتر الآن';
    buyBtn.disabled = false;
    loginBtns.style.display = 'none';
}

// زر الشراء
document.getElementById('buyBtn').addEventListener('click', function() {
    if (!currentUser) {
        alert('🔒 يرجى تسجيل الدخول أولاً!');
        return;
    }
    alert('🎉 تم الشراء بنجاح!\nشكراً لك ' + currentUser.name);
});

// ===== تحميل الإعدادات المحفوظة =====
window.onload = function() {
    // استرجاع الإعدادات من localStorage
    if (localStorage.getItem('storeName')) {
        document.getElementById('editStoreName').value = localStorage.getItem('storeName');
        document.getElementById('editPrice').value = localStorage.getItem('storePrice');
        document.getElementById('editFeatures').value = localStorage.getItem('storeFeatures');
        document.getElementById('editIcon').value = localStorage.getItem('storeIcon');
        document.getElementById('editFooter').value = localStorage.getItem('storeFooter');
        updateStore();
        updateFeatures();
    }
};

// حفظ الإعدادات تلقائياً
setInterval(() => {
    localStorage.setItem('storeName', document.getElementById('editStoreName').value);
    localStorage.setItem('storePrice', document.getElementById('editPrice').value);
    localStorage.setItem('storeFeatures', document.getElementById('editFeatures').value);
    localStorage.setItem('storeIcon', document.getElementById('editIcon').value);
    localStorage.setItem('storeFooter', document.getElementById('editFooter').value);
}, 2000);
</script>

</body>
</html>
