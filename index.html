<!DOCTYPE html>
<html>
<head>
    <title>Royal Card</title>
    <style>
        body {
            background: #0b0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial;
        }
        .card {
            background: gold;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
        }
        h1 { color: #1a1f2f; font-size: 50px; }
        .price { font-size: 40px; color: #1a1f2f; }
        button {
            background: #1a1f2f;
            color: gold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>👑 Royal</h1>
        <div class="price">$49.99</div>
        <button onclick="alert('تم التفعيل!')">فعّل الآن</button>
    </div>
</body>
</html>
