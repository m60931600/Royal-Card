<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رويال كارد 👑 - المتجر الأسطوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #ffd700;
            --primary-dark: #c9a800;
            --primary-light: #fff3b0;
            --primary-glow: rgba(255,215,0,0.3);
            --bg: #0a0a1a;
            --bg-card: rgba(255,255,255,0.05);
            --bg-hover: rgba(255,215,0,0.1);
            --text: #ffffff;
            --text-dim: #aaaaaa;
            --text-dark: #1a1a2e;
            --border: rgba(255,215,0,0.15);
            --radius: 16px;
            --shadow: 0 10px 40px rgba(0,0,0,0.5);
            --shadow-gold: 0 0 40px rgba(255,215,0,0.2);
            --success: #4caf50;
            --danger: #ff4444;
            --warning: #ff9800;
            --info: #2196f3;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gradient-gold: linear-gradient(135deg, #ffd700, #f5b342, #ffd700);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        
    <h1>رويال كارد</h1>
    <div class="sub">المتجر الأسطوري</div>
    <div class="loader"></div>
</div>

<!-- ===== باقي محتوى الموقع ===== -->
<div class="marquee-bar">
    <div class="marquee-content" id="marqueeContent">
        <span><i class="fas fa-fire"></i> عروض حصرية بأسعار خيالية</span>
        <span><i class="fas fa-star"></i> خدمة فورية 24/7</span>
        <span><i class="fas fa-coins"></i> أفضل الأسعار في السوق</span>
        <span><i class="fas fa-rocket"></i> تسوق الآن واستمتع بالخصومات</span>
        <span><i class="fas fa-shield-alt"></i> ضمان الجودة 100%</span>
    </div>
</div>

<div class="top-bar">
    <div class="balance">
        <i class="fas fa-wallet"></i> رصيدي: <span id="headerBalance">0</span> <span id="currencySymbol">دولار</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button class="btn-add" onclick="showAddBalanceModal()"><i class="fas fa-plus"></i> إضافة رصيد</button>
        <span id="userNameDisplay" style="color:var(--primary);font-weight:bold;"></span>
        <button id="loginBtnTop" class="btn-add" onclick="showLoginModal()">تسجيل الدخول</button>
        <button id="logoutBtnTop" class="btn-add" onclick="logout()" style="background:#ff4444;color:#fff;display:none;">خروج</button>
    </div>
</div>

<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
</button>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
    <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    <div class="profile-section">
        <div class="profile-avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()">
            <span id="avatarText">👤</span>
            <img id="avatarImage" style="display:none;" alt="صورة الملف الشخصي">
            <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">
        </div>
        <div class="profile-name" id="profileName">زائر</div>
        <div class="profile-email" id="profileEmail">غير مسجل</div>
    </div>
    <ul class="menu-items" id="menuItems">
        <li onclick="showPage('home')"><i class="fas fa-home"></i> الرئيسية</li>
        <li onclick="showPage('balance')"><i class="fas fa-wallet"></i> الرصيد</li>
        <li onclick="showPage('payment')"><i class="fas fa-credit-card"></i> الدفع</li>
        <li onclick="showPage('orders')"><i class="fas fa-list"></i> طلباتي</li>
        <li onclick="showPage('admin')" id="adminMenuLink" style="display:none;"><i class="fas fa-cog"></i> إدارة الموقع <span id="adminNotificationBadge" class="notification-badge" style="display:none;">0</span></li>
    </ul>
    <div class="currency-section">
        <h4>💱 العملات</h4>
        <div id="currencyList">
            <div class="currency-item active" data-currency="usd" onclick="changeCurrency('usd')">
                <span>🇺🇸 دولار أمريكي</span>
                <span class="rate">1 = 1</span>
            </div>
            <div class="currency-item" data-currency="syp" onclick="changeCurrency('syp')">
                <span>🇸🇾 ليرة سورية</span>
                <span class="rate" id="sypRate">1 = 130</span>
            </div>
        </div>
    </div>
    <div class="logout-btn" onclick="logout()">🚪 تسجيل الخروج</div>
</div>

<nav class="bottom-nav">
    <a class="active" onclick="showPage('home')"><i class="fas fa-home"></i> الرئيسية</a>
    <a onclick="showPage('balance')"><i class="fas fa-wallet"></i> الرصيد</a>
    <a onclick="showPage('payment')"><i class="fas fa-credit-card"></i> الدفع</a>
    <a onclick="showPage('orders')"><i class="fas fa-list"></i> طلباتي</a>
    <a onclick="showPage('admin')" id="adminNavLink" style="color:var(--primary);display:none;"><i class="fas fa-cog"></i> إدارة</a>
</nav>

<div class="container">
    <section id="page-home" class="page active">
        <h2 class="section-title">🛍️ المتجر الأسطوري</h2>
        <div id="homeContent">
            <div style="text-align:center;padding:30px 0;">
                <div style="font-size:60px;color:var(--primary);margin-bottom:15px;">👑</div>
                <h2 style="color:var(--primary);font-size:28px;">مرحباً بك في رويال كارد</h2>
                <p style="color:var(--text-dim);font-size:16px;margin:10px 0;">أفضل المتاجر الرقمية بجودة عالية</p>
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;">
                    <button class="btn btn-primary" onclick="showPage('payment')">💳 طرق الدفع</button>
                    <button class="btn btn-secondary" onclick="showPage('balance')">💰 رصيدي</button>
                    <button class="btn btn-secondary" onclick="showPage('orders')">📋 طلباتي</button>
                </div>
                <div class="grid-3" style="margin-top:30px;">
                    <div style="background:var(--bg-card);padding:20px;border-radius:var(--radius);border:1px solid var(--border);text-align:center;">
                        <div style="font-size:30px;color:var(--primary);">⭐</div>
                        <div style="font-weight:bold;margin-top:5px;">4.9/5</div>
                        <div style="font-size:12px;color:var(--text-dim);">تقييم العملاء</div>
                    </div>
                    <div style="background:var(--bg-card);padding:20px;border-radius:var(--radius);border:1px solid var(--border);text-align:center;">
                        <div style="font-size:30px;color:var(--primary);">✅</div>
                        <div style="font-weight:bold;margin-top:5px;">100%</div>
                        <div style="font-size:12px;color:var(--text-dim);">ضمان الجودة</div>
                    </div>
                    <div style="background:var(--bg-card);padding:20px;border-radius:var(--radius);border:1px solid var(--border);text-align:center;">
                        <div style="font-size:30px;color:var(--primary);">⚡</div>
                        <div style="font-weight:bold;margin-top:5px;">فوري</div>
                        <div style="font-size:12px;color:var(--text-dim);">توصيل الخدمة</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="page-payment" class="page">
        <h2 class="section-title">💳 طرق الدفع</h2>
        <div id="paymentMethodsGrid" class="grid-3"></div>
    </section>

    <section id="page-balance" class="page">
        <h2 class="section-title">💰 الرصيد</h2>
        <div style="text-align:center;background:var(--bg-card);border:2px solid var(--primary);border-radius:var(--radius);padding:30px;max-width:400px;margin:auto;">
            <i class="fas fa-wallet" style="font-size:60px;color:var(--primary);"></i>
            <div style="font-size:36px;color:var(--primary);font-weight:bold;margin:15px 0;" id="balancePageAmount">0</div>
            <div style="color:var(--text-dim);">رصيدك الحالي</div>
            <button class="btn btn-primary mt-20" onclick="showAddBalanceModal()">💰 إضافة رصيد</button>
        </div>
    </section>

    <section id="page-orders" class="page">
        <h2 class="section-title">📋 طلباتي</h2>
        <div id="ordersList"></div>
    </section>

    <section id="page-admin" class="page">
        <h2 class="section-title">🔧 لوحة التحكم</h2>
        <div class="admin-panel">
            <h3>📊 الإحصائيات</h3>
            <div class="grid-3">
                <div style="background:var(--bg-card);padding:15px;border-radius:var(--radius);text-align:center;">
                    <div style="font-size:28px;color:var(--primary);" id="statUsers">0</div>
                    <div style="color:var(--text-dim);font-size:13px;">👥 المستخدمين</div>
                </div>
                <div style="background:var(--bg-card);padding:15px;border-radius:var(--radius);text-align:center;">
                    <div style="font-size:28px;color:var(--primary);" id="statOrders">0</div>
                    <div style="color:var(--text-dim);font-size:13px;">📦 الطلبات</div>
                </div>
                <div style="background:var(--bg-card);padding:15px;border-radius:var(--radius);text-align:center;">
                    <div style="font-size:28px;color:var(--primary);" id="statRevenue">0</div>
                    <div style="color:var(--text-dim);font-size:13px;">💰 الأرباح</div>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- ===== نافذة تسجيل الدخول ===== -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('loginModal')">✕</span>
        <h2>🔑 تسجيل الدخول</h2>
        <div id="loginFields">
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
            <input type="password" id="loginPassword" placeholder="كلمة المرور">
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="login()">تسجيل الدخول</button>
                <button class="btn btn-secondary" onclick="showRegister()">إنشاء حساب</button>
            </div>
        </div>
        <div id="registerFields" style="display:none;">
            <input type="text" id="regUsername" placeholder="اسم المستخدم">
            <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
            <input type="tel" id="regPhone" placeholder="رقم الهاتف">
            <input type="password" id="regPassword" placeholder="كلمة المرور">
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="register()">إنشاء حساب</button>
                <button class="btn btn-secondary" onclick="showLogin()">عودة</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== نافذة إضافة رصيد ===== -->
<div class="modal" id="balanceModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('balanceModal')">✕</span>
        <h2>💰 إضافة رصيد</h2>
        <div id="balanceError" class="error-msg"></div>
        <div id="balanceSuccess" class="success-msg"></div>
        <input type="number" id="balanceAmount" placeholder="المبلغ بالدولار" min="1">
        <input type="text" id="balanceTransferCode" placeholder="رقم عملية التحويل">
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="requestBalance()">إرسال طلب</button>
            <button class="btn btn-danger" onclick="closeModal('balanceModal')">إلغاء</button>
        </div>
        <div id="balanceStatus" style="text-align:center;margin-top:10px;font-size:14px;"></div>
    </div>
</div>

<script>
// ===== البيانات =====
let currentUser = null;
let balance = 0;
let paymentMethods = [];
let categories = [];
let subCategories = [];
let products = [];
let orders = [];
let balanceRequests = [];
let users = [];
let admins = [];
let currencies = [];
let selectedCurrency = 'usd';
let exchangeRates = { usd: 1, syp: 130 };
let adminPassword = 'Admin@2024';
let commissionRate = 1;
let minTransferAmount = 5;
let isSidebarOpen = false;

// ===== تحميل البيانات =====
function loadData() {
    try {
        balance = parseFloat(localStorage.getItem('balance')) || 0;
        paymentMethods = JSON.parse(localStorage.getItem('paymentMethods')) || [
            { id: 1, name: 'شنكاشي', number: '0991234567', image: '' }
        ];
        categories = JSON.parse(localStorage.getItem('categories')) || [];
        subCategories = JSON.parse(localStorage.getItem('subCategories')) || [];
        products = JSON.parse(localStorage.getItem('products')) || [];
        orders = JSON.parse(localStorage.getItem('orders')) || [];
        balanceRequests = JSON.parse(localStorage.getItem('balanceRequests')) || [];
        users = JSON.parse(localStorage.getItem('users')) || [];
        admins = JSON.parse(localStorage.getItem('admins')) || [];
        currencies = JSON.parse(localStorage.getItem('currencies')) || [
            { id: 1, name: 'دولار أمريكي', symbol: '🇺🇸', rate: 1, code: 'usd' },
            { id: 2, name: 'ليرة سورية', symbol: '🇸🇾', rate: 130, code: 'syp' }
        ];
        exchangeRates = JSON.parse(localStorage.getItem('exchangeRates')) || { usd: 1, syp: 130 };
        adminPassword = localStorage.getItem('adminPassword') || 'Admin@2024';
        commissionRate = parseFloat(localStorage.getItem('commissionRate')) || 1;
        minTransferAmount = parseFloat(localStorage.getItem('minTransferAmount')) || 5;
        
        const adminExists = admins.some(a => a.email === 'admin@royal.com');
        if (!adminExists && admins.length === 0) {
            admins.push({ email: 'admin@royal.com', password: adminPassword, name: 'المدير الرئيسي' });
            localStorage.setItem('admins', JSON.stringify(admins));
        }
        const userData = localStorage.getItem('currentUser');
        if (userData) currentUser = JSON.parse(userData);
    } catch(e) { console.log('خطأ', e); }
}

function saveData() {
    localStorage.setItem('balance', balance);
    localStorage.setItem('paymentMethods', JSON.stringify(paymentMethods));
    localStorage.setItem('categories', JSON.stringify(categories));
    localStorage.setItem('subCategories', JSON.stringify(subCategories));
    localStorage.setItem('products', JSON.stringify(products));
    localStorage.setItem('orders', JSON.stringify(orders));
    localStorage.setItem('balanceRequests', JSON.stringify(balanceRequests));
    localStorage.setItem('users', JSON.stringify(users));
    localStorage.setItem('admins', JSON.stringify(admins));
    localStorage.setItem('currencies', JSON.stringify(currencies));
    localStorage.setItem('exchangeRates', JSON.stringify(exchangeRates));
    localStorage.setItem('adminPassword', adminPassword);
    localStorage.setItem('commissionRate', commissionRate);
    localStorage.setItem('minTransferAmount', minTransferAmount);
    if (currentUser) localStorage.setItem('currentUser', JSON.stringify(currentUser));
}

// ===== إخفاء شاشة الترحيب =====
window.onload = function() {
    // إنشاء النجوم
    const c = document.getElementById('stars');
    for (let i=0; i<80; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.width = Math.random()*2+1+'px';
        s.style.height = s.style.width;
        s.style.left = Math.random()*100+'%';
        s.style.top = Math.random()*100+'%';
        s.style.setProperty('--duration', (Math.random()*3+2)+'s');
        s.style.animationDelay = (Math.random()*5)+'s';
        c.appendChild(s);
    }
    loadData();
    updateUI();
    // إخفاء شاشة الترحيب بعد 500 مللي
    setTimeout(function() {
    }, 500);
};

// ===== باقي الدوال =====
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const hamburger = document.getElementById('hamburger');
    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
    hamburger.classList.toggle('active');
    isSidebarOpen = sidebar.classList.contains('active');
}

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page-' + page);
    if (target) target.classList.add('active');
    document.querySelectorAll('.bottom-nav a').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.bottom-nav a').forEach(a => {
        if (a.onclick && a.onclick.toString().includes(page)) a.classList.add('active');
    });
    document.querySelectorAll('.menu-items li').forEach(a => a.classList.remove('active'));
    document.querySelectorAll('.menu-items li').forEach(a => {
        if (a.onclick && a.onclick.toString().includes(page)) a.classList.add('active');
    });
    if (page === 'admin') {
        if (!isAdmin()) { alert('⚠️ هذه الصفحة مخصصة للمدراء فقط!'); showPage('home'); return; }
        renderAdminPanel();
    }
    if (page === 'payment') renderPaymentMethods();
    if (page === 'orders') renderOrders();
    if (page === 'balance') updateBalance();
    if (isSidebarOpen) toggleSidebar();
}

function isAdmin() {
    if (!currentUser) return false;
    return admins.some(a => a.email === currentUser.email);
}

function changeCurrency(code) {
    selectedCurrency = code;
    document.querySelectorAll('.currency-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.currency-item[data-currency="${code}"]`)?.classList.add('active');
    updateBalance();
    localStorage.setItem('selectedCurrency', code);
}

function convertCurrency(amount, from, to) {
    if (from === to) return amount;
    const rateFrom = exchangeRates[from] || 1;
    const rateTo = exchangeRates[to] || 1;
    return (amount / rateFrom) * rateTo;
}

function updateBalance() {
    const displayBalance = convertCurrency(balance, 'usd', selectedCurrency);
    document.getElementById('headerBalance').textContent = displayBalance.toFixed(2);
    document.getElementById('balancePageAmount').textContent = displayBalance.toFixed(2);
    const currency = currencies.find(c => c.code === selectedCurrency);
    document.getElementById('currencySymbol').textContent = currency ? currency.symbol : 'دولار';
}

function renderPaymentMethods() {
    const container = document.getElementById('paymentMethodsGrid');
    if (!container) return;
    container.innerHTML = paymentMethods.map(m => `
        <div class="payment-card" onclick="showPaymentDetail(${m.id})">
            ${m.image ? `<div class="pm-image"><img src="${m.image}" alt="${m.name}"></div>` : `<div class="pm-image" style="font-size:60px;color:var(--primary);display:flex;align-items:center;justify-content:center;">💳</div>`}
            <div class="pm-name">${m.name}</div>
            <div class="pm-number">${m.number}</div>
        </div>
    `).join('') || '<p style="color:var(--text-dim);text-align:center;">لا توجد طرق دفع</p>';
}

function showPaymentDetail(id) {
    if (!currentUser) { showLoginModal(); return; }
    const method = paymentMethods.find(m => m.id === id);
    if (!method) return;
    alert('📄 صفحة الدفع لـ ' + method.name + '\nالرقم: ' + method.number + '\n(سيتم إضافة صفحة منفصلة قريباً)');
}

function showAddBalanceModal() {
    if (!currentUser) { showLoginModal(); return; }
    document.getElementById('balanceModal').classList.add('show');
    document.getElementById('balanceAmount').value = '';
    document.getElementById('balanceTransferCode').value = '';
    document.getElementById('balanceStatus').textContent = '';
}

function requestBalance() {
    const amount = parseFloat(document.getElementById('balanceAmount').value);
    const code = document.getElementById('balanceTransferCode').value.trim();
    if (!amount || amount < 1) return alert('❌ أدخل مبلغاً صحيحاً');
    if (amount < minTransferAmount) return alert('❌ الحد الأدنى للتحويل هو ' + minTransferAmount + ' دولار');
    if (!code) return alert('❌ أدخل رقم عملية التحويل');
    
    const request = {
        id: Date.now(),
        userId: currentUser.email,
        userName: currentUser.name,
        amount: amount,
        transferCode: code,
        date: new Date().toLocaleString('ar'),
        status: 'pending'
    };
    balanceRequests.push(request);
    saveData();
    document.getElementById('balanceStatus').textContent = '✅ تم إرسال طلبك بنجاح! سيتم إضافة الرصيد بعد التأكيد من الإدارة.';
    document.getElementById('balanceStatus').style.color = 'var(--success)';
    document.getElementById('balanceAmount').value = '';
    document.getElementById('balanceTransferCode').value = '';
    updateStats();
    setTimeout(() => closeModal('balanceModal'), 3000);
}

function renderOrders() {
    const container = document.getElementById('ordersList');
    if (!container) return;
    container.innerHTML = orders.map(o => `
        <div style="background:rgba(255,255,255,0.03);padding:10px;border-radius:10px;margin:5px 0;border-left:3px solid var(--primary);">
            <div>🛍️ ${o.productName || 'طلب'}</div>
            <div>💰 ${o.amount || o.price || 0} دولار</div>
            <div>📅 ${o.date || new Date().toLocaleDateString('ar')}</div>
            <div>الحالة: <span style="color:${o.status === 'مكتمل' ? 'var(--success)' : o.status === 'مرفوض' ? 'var(--danger)' : 'var(--warning)'};">${o.status || 'قيد التنفيذ'}</span></div>
        </div>
    `).join('') || '<p style="text-align:center;color:var(--text-dim);">لا توجد طلبات</p>';
}

function renderUsers() {
    const container = document.getElementById('usersList');
    if (!container) return;
    container.innerHTML = users.map(u => `
        <div class="admin-user-item">
            <div><strong>${u.name || 'بدون اسم'}</strong> - ${u.email}</div>
            <div style="font-size:12px;color:var(--text-dim);">📱 ${u.phone || 'لا يوجد'} | 📅 ${u.date || 'غير معروف'}</div>
            <div style="font-size:12px;color:var(--text-dim);">💰 الرصيد: ${u.balance || 0} دولار</div>
            <button class="btn btn-danger" onclick="deleteUser('${u.email}')" style="font-size:11px;padding:4px 12px;">🗑️ حذف</button>
        </div>
    `).join('') || '<p style="color:var(--text-dim);">لا يوجد مستخدمين مسجلين</p>';
}

function deleteUser(email) {
    if (!isAdmin()) return alert('🔒 فقط المدراء');
    if (!confirm('هل أنت متأكد من حذف هذا المستخدم؟')) return;
    users = users.filter(u => u.email !== email);
    saveData();
    renderUsers();
    updateStats();
}

function renderAdminList() {
    const container = document.getElementById('adminList');
    if (!container) return;
    container.innerHTML = admins.map(a => `
        <div class="admin-product-item">
            <span>👑 ${a.name} - ${a.email}</span>
            ${a.email !== 'admin@royal.com' ? `<button class="btn btn-danger" onclick="removeAdmin('${a.email}')">🗑️ حذف</button>` : '<span style="color:var(--primary);font-size:12px;">(المالك)</span>'}
        </div>
    `).join('');
}

function addAdmin() {
    if (!isAdmin()) return alert('🔒 فقط المدير الرئيسي');
    const email = document.getElementById('newAdminEmail').value.trim();
    const password = document.getElementById('newAdminPass').value.trim();
    const name = document.getElementById('newAdminName').value.trim() || 'مدير';
    if (!email || !password) return alert('❌ أدخل الإيميل وكلمة المرور');
    if (admins.some(a => a.email === email)) return alert('❌ هذا الإيميل مدير بالفعل');
    admins.push({ email, password, name });
    saveData();
    renderAdminList();
    document.getElementById('newAdminEmail').value = '';
    document.getElementById('newAdminPass').value = '';
    document.getElementById('newAdminName').value = '';
    alert('✅ تم إضافة المدير');
}

function removeAdmin(email) {
    if (!isAdmin()) return alert('🔒 فقط المدير الرئيسي');
    if (email === 'admin@royal.com') return alert('❌ لا يمكن حذف المدير الرئيسي');
    if (!confirm('هل أنت متأكد من حذف هذا المدير؟')) return;
    admins = admins.filter(a => a.email !== email);
    saveData();
    renderAdminList();
    alert('✅ تم حذف المدير');
}

function changeAdminPassword() {
    if (!isAdmin()) return alert('🔒 فقط المدير الرئيسي');
    const newPass = document.getElementById('newAdminPassword').value.trim();
    if (!newPass || newPass.length < 6) return alert('❌ كلمة المرور 6 أحرف على الأقل');
    adminPassword = newPass;
    const mainAdmin = admins.find(a => a.email === 'admin@royal.com');
    if (mainAdmin) mainAdmin.password = newPass;
    saveData();
    document.getElementById('passwordChangeMsg').innerHTML = '<span style="color:var(--success);">✅ تم التغيير</span>';
    document.getElementById('newAdminPassword').value = '';
    alert('✅ تم تغيير كلمة المرور');
}

function updateStats() {
    document.getElementById('statUsers').textContent = users.length;
    document.getElementById('statOrders').textContent = orders.length;
    const totalRevenue = orders.reduce((sum, o) => sum + (o.price || 0), 0);
    document.getElementById('statRevenue').textContent = totalRevenue.toFixed(2);
}

function updateUI() {
    const loginBtn = document.getElementById('loginBtnTop');
    const logoutBtn = document.getElementById('logoutBtnTop');
    const userNameDisplay = document.getElementById('userNameDisplay');
    const profileName = document.getElementById('profileName');
    const profileEmail = document.getElementById('profileEmail');
    const adminMenuLink = document.getElementById('adminMenuLink');
    const adminNavLink = document.getElementById('adminNavLink');
    
    if (currentUser) {
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        userNameDisplay.textContent = '👋 ' + (currentUser.name || 'مستخدم');
        profileName.textContent = currentUser.name || 'مستخدم';
        profileEmail.textContent = currentUser.email || '';
        const isAdminUser = isAdmin();
        adminMenuLink.style.display = isAdminUser ? 'block' : 'none';
        adminNavLink.style.display = isAdminUser ? 'block' : 'none';
        if (currentUser.avatar) {
            document.getElementById('avatarImage').style.display = 'block';
            document.getElementById('avatarImage').src = currentUser.avatar;
            document.getElementById('avatarText').style.display = 'none';
        }
    } else {
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        userNameDisplay.textContent = '';
        profileName.textContent = 'زائر';
        profileEmail.textContent = 'غير مسجل';
        adminMenuLink.style.display = 'none';
        adminNavLink.style.display = 'none';
    }
    updateBalance();
    renderPaymentMethods();
    renderOrders();
    renderUsers();
    renderAdminList();
    updateStats();
}

function renderAdminPanel() {
    renderUsers();
    renderPaymentMethods();
    renderAdminList();
    updateStats();
}

function showLogin() {
    document.getElementById('loginFields').style.display = 'block';
    document.getElementById('registerFields').style.display = 'none';
}

function showRegister() {
    document.getElementById('loginFields').style.display = 'none';
    document.getElementById('registerFields').style.display = 'block';
}

function register() {
    const name = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPassword').value.trim();
    if (!name || !email || !phone || !password) return alert('❌ أدخل جميع البيانات');
    if (users.some(u => u.email === email)) return alert('❌ هذا الإيميل مسجل مسبقاً');
    const newUser = { name, email, phone, password, balance: 0, date: new Date().toLocaleDateString('ar'), avatar: '' };
    users.push(newUser);
    currentUser = newUser;
    saveData();
    updateUI();
    closeModal('loginModal');
    alert('✅ تم إنشاء الحساب بنجاح!');
    showPage('home');
}

function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!email || !password) return alert('❌ أدخل الإيميل وكلمة المرور');
    const admin = admins.find(a => a.email === email && a.password === password);
    if (admin) {
        currentUser = { name: admin.name || 'مدير', email: admin.email, isAdmin: true };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        updateUI();
        closeModal('loginModal');
        alert('👋 مرحباً أيها المدير!');
        showPage('admin');
        return;
    }
    const user = users.find(u => u.email === email && u.password === password);
    if (user) {
        currentUser = user;
        saveData();
        updateUI();
        closeModal('loginModal');
        alert('👋 مرحباً ' + user.name);
        showPage('home');
        return;
    }
    alert('❌ الإيميل أو كلمة المرور غير صحيحة، أو الحساب غير موجود');
}

function logout() {
    if (!confirm('هل أنت متأكد أنك تريد تسجيل الخروج؟')) return;
    currentUser = null;
    localStorage.removeItem('currentUser');
    updateUI();
    alert('👋 تم تسجيل الخروج');
    showPage('home');
    if (isSidebarOpen) toggleSidebar();
}

function showLoginModal() {
    document.getElementById('loginModal').classList.add('show');
    showLogin();
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
}

function closeModal(id) {
    document.getElementById(id).classList.remove('show');
}

function uploadAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const dataUrl = e.target.result;
        document.getElementById('avatarImage').style.display = 'block';
        document.getElementById('avatarImage').src = dataUrl;
        document.getElementById('avatarText').style.display = 'none';
        if (currentUser) { currentUser.avatar = dataUrl; saveData(); }
    };
    reader.readAsDataURL(file);
}

// ===== تهيئة التطبيق =====
loadData();
updateUI();
const savedCurrency = localStorage.getItem('selectedCurrency');
if (savedCurrency) {
    selectedCurrency = savedCurrency;
    document.querySelectorAll('.currency-item').forEach(el => {
        el.classList.toggle('active', el.dataset.currency === savedCurrency);
    });
}
console.log('👑 رويال كارد جاهز!');
</script>
</body>
</html>
