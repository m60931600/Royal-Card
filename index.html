<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Card 👑</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(145deg, #0b0e1a, #1a1f2f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: linear-gradient(135deg, #f7e05e, #f5b342);
            max-width: 400px;
            width: 100%;
            padding: 30px 25px;
            border-radius: 60px 20px 60px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 3px #ffd966, 0 0 0 8px #1a1f2f;
            text-align: center;
            color: #1a1a2e;
            transition: 0.3s;
        }
        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(245, 179, 66, 0.4);
        }
        .card h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0 #fff3b0;
            margin-bottom: 5px;
        }
        .card .sub {
            font-size: 1.2rem;
            background: #1a1f2f;
            color: #f7e05e;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .card .price {
            font-size: 3.8rem;
            font-weight: 900;
            background: #1a1f2f;
            color: #f7e05e;
            padding: 10px 20px;
            border-radius: 80px;
            display: inline-block;
            margin: 10px 0 20px;
            box-shadow: inset 0 -4px 0 #b37b2e;
        }
        .card .features {
            text-align: right;
            background: rgba(26, 31, 47, 0.2);
            padding: 15px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            margin: 15px 0;
            font-weight: 600;
            font-size: 1rem;
        }
        .card .features li {
            list-style: none;
            padding: 6px 0;
            border-bottom: 1px dashed #ffffff70;
        }
        .card .features li:last-child {
            border: none;
        }
        .card .btn {
            background: #1a1f2f;
            color: #f7e05e;
            border: none;
            padding: 16px 30px;
            font-size: 1.4rem;
            font-weight: 800;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.2s;
            box-shadow: 0 8px 0 #0b0e1a;
            margin-top: 10px;
        }
        .card .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 0 #0b0e1a;
            background: #2a2f4a;
        }
        .card .btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #0b0e1a;
        }
        .footer {
            margin-top: 18px;
            font-size: 0.8rem;
            opacity: 0.7;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>👑 Royal</h1>
        <span class="sub">✦ VIP CARD ✦</span>
        <div class="price">$49.99</div>
        <ul class="features">
            <li>✅ وصول غير محدود</li>
            <li>✅ دعم فوري 24/7</li>
            <li>✅ مميزات حصرية</li>
            <li>✅ تجربة أسطورية</li>
        </ul>
        <button class="btn" onclick="alert('👑 تم التفعيل بنجاح!')">فعّل الآن</button>
        <div class="footer">© 2026 Royal Card — صنع بالذكاء</div>
    </div>
</body>
</html>
